clear_race_control_log:
  name: Clear race control log
  description: Clear the saved race control messages for the current session.
  fields:
    entity_id:
      name: Race control entity
      description: The race control sensor to clear saved messages for.
      required: true
      example: sensor.f1_race_control
      selector:
        text:

transcribe_team_radio:
  name: "Experimental: Transcribe team radio"
  description: >-
    Experimental feature. Transcribe the latest published team radio clip in
    English and separate distinct voices as anonymous speakers A and B. Audio
    is sent only when you run this action, to your selected AI Task provider,
    and may incur provider charges.
  fields:
    entity_id:
      name: Team radio entity
      description: The F1 Sensor team radio entity whose latest clip is used.
      required: true
      example: sensor.f1_team_radio
      selector:
        entity:
          filter:
            - integration: f1_sensor
              domain: sensor
    ai_task_entity_id:
      name: AI Task entity
      description: >-
        The AI Task entity used for audio transcription. This experimental
        feature is tested with a Google Gemini AI Task entity that supports
        audio files.
      required: true
      example: ai_task.google_ai_task
      selector:
        entity:
          filter:
            - domain: ai_task
    force:
      name: Force new transcription
      description: >-
        Experimental cost control. Run a new paid AI request even if this clip
        already has a cached transcription.
      required: false
      default: false
      selector:
        boolean:
