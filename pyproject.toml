[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
  "E501",  # line too long — handled by formatter
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["performance: weekly timing budgets; excluded from PR gates"]

[tool.coverage.run]
branch = true
source = ["custom_components/f1_sensor"]
omit = [
  "*/tests/*",
  "*/track_map_static_geometry_builder.py",
  "*/track_map_static_geometry_calibrator.py",
  "*/track_map_static_geometry_maintenance.py",
  "*/track_map_static_geometry_qa.py",
]
