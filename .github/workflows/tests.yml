name: Tests

on:
  push:
    branches: [dev, beta, main]
    paths:
      - ".github/workflows/tests.yml"
      - "hacs.json"
      - "custom_components/**/*.py"
      - "custom_components/**/manifest.json"
      - "custom_components/**/*.js"
      - "custom_components/**/tests/**"
      - "quality/coverage-ratchet.json"
      - "scripts/check_coverage.py"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Minimum HA 2024.11
            coverage-gate: false
            coverage-package: pytest-cov==5.0.0
            python-version: "3.12"
            test-package: pytest-homeassistant-custom-component==0.13.181
            compatibility-pins: '"josepy<2" "pycares==4.4.0"'
            test-paths: >-
              custom_components/f1_sensor/tests/test_setup.py
              custom_components/f1_sensor/tests/test_config_flow_entity_naming.py
              custom_components/f1_sensor/tests/test_storage.py
              custom_components/f1_sensor/tests/test_helpers.py
              custom_components/f1_sensor/tests/test_coordinator.py
              custom_components/f1_sensor/tests/test_device_trigger.py
              custom_components/f1_sensor/tests/test_diagnostics.py
              custom_components/f1_sensor/tests/test_frontend.py
              custom_components/f1_sensor/tests/test_session_clock.py
          - name: Current HA
            coverage-gate: true
            coverage-package: pytest-cov==7.0.0
            python-version: "3.14"
            test-package: pytest-homeassistant-custom-component==0.13.307
            compatibility-pins: ""
            test-paths: custom_components/f1_sensor/tests/
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: >
          pip install
          "${{ matrix.test-package }}"
          ${{ matrix.compatibility-pins }}
          "${{ matrix.coverage-package }}"

      - name: Run tests
        run: >
          python -m pytest
          ${{ matrix.test-paths }}
          --cov=custom_components.f1_sensor
          --cov-report=term-missing
          --cov-report=json:coverage.json
          -q

      - name: Enforce coverage ratchet
        if: ${{ matrix.coverage-gate }}
        run: python scripts/check_coverage.py coverage.json
