name: Python tests
on:
  workflow_call:
    inputs:
      checkout_ref:
        type: string
        default: ''
      blueprints_only:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  tests:
    name: HA current
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout_ref || (github.event.inputs.pull_request && format('refs/pull/{0}/merge', github.event.inputs.pull_request)) || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements/ha-current.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - run: pip install -r requirements/ha-current.txt
      - name: Test shared backend profile
        if: ${{ !inputs.blueprints_only }}
        run: python scripts/run_check.py backend
      - name: Test shared blueprint profile
        if: inputs.blueprints_only
        run: python scripts/run_check.py blueprints
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: python-current-${{ inputs.blueprints_only }}
          path: |
            test-results/python-*.xml
            coverage.json
          retention-days: 7
