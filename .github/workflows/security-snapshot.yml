name: Dependency security snapshot
on:
  workflow_call:
    inputs:
      tools_ref:
        description: Immutable reviewed evaluator commit
        type: string
        default: ''
      target_ref:
        description: Optional dependency snapshot instead of the permanent branch matrix
        type: string
        default: ''
      mode:
        description: Full health gate or newly introduced severe dependency exposure
        type: string
        default: gate
      base:
        description: Immutable comparison commit required for introduced mode
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: dependency-security-health-${{ inputs.target_ref || 'daily' }}
  cancel-in-progress: false
jobs:
  audit:
    name: Dependency ${{ inputs.mode == 'introduced' && 'change audit' || 'security health' }} on ${{ matrix.branch }}
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(inputs.target_ref != '' && '["snapshot"]' || '["dev","beta","main"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the reviewed evaluator, not the branch being scanned
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tools_ref || github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Use the project npm version
        run: node scripts/install_project_npm.cjs
      - name: Assess the branch dependency snapshot without installing or running it
        env:
          AUDIT_REF: ${{ inputs.target_ref || format('refs/heads/{0}', matrix.branch) }}
          AUDIT_TARGET_REF: ${{ inputs.target_ref }}
          AUDIT_MODE: ${{ inputs.mode }}
          AUDIT_BASE: ${{ inputs.base }}
        run: |
          case "$AUDIT_MODE" in
            gate) ;;
            introduced)
              if [[ -z "$AUDIT_TARGET_REF" || ! "$AUDIT_BASE" =~ ^[0-9a-f]{40}$ ]]; then
                echo 'Introduced dependency audit requires an explicit snapshot and immutable comparison commit.' >&2
                exit 1
              fi
              ;;
            *)
              echo 'Dependency audit mode must be gate or introduced.' >&2
              exit 1
              ;;
          esac
          case "$AUDIT_REF" in
            dev|beta|main) AUDIT_REF="refs/heads/$AUDIT_REF" ;;
          esac
          if [[ ! "$AUDIT_REF" =~ ^([0-9a-f]{40}|refs/heads/(dev|beta|main)|refs/pull/[0-9]+/merge)$ ]]; then
            echo 'Dependency snapshot must be an immutable commit or an approved branch/PR ref.' >&2
            exit 1
          fi
          git fetch --no-tags -- origin "$AUDIT_REF"
          snapshot=$(git rev-parse --verify 'FETCH_HEAD^{commit}')
          audit_args=(--mode "$AUDIT_MODE" --target-ref "$snapshot")
          if [[ "$AUDIT_MODE" == introduced ]]; then
            git fetch --no-tags -- origin "$AUDIT_BASE"
            baseline=$(git rev-parse --verify 'FETCH_HEAD^{commit}')
            if [[ "$baseline" != "$AUDIT_BASE" ]]; then
              echo 'Dependency comparison must resolve to the requested immutable commit.' >&2
              exit 1
            fi
            audit_args+=(--base "$baseline")
          fi
          python3 scripts/run_npm_audit.py "${audit_args[@]}"
