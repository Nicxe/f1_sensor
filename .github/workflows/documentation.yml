name: Documentation
on:
  workflow_call:
    inputs:
      checkout_ref:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    # Preserve the documentation check budget even when browser setup is slow.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tested
          persist-credentials: false
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: tested/.python-version
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: tested/.node-version
          cache: npm
          cache-dependency-path: tested/package-lock.json
      - name: Use the project npm version
        run: node scripts/install_project_npm.cjs
        working-directory: tested
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
        working-directory: tested
      - name: Install Chromium and system dependencies
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium
        working-directory: tested
      - name: Verify documentation build and browser behavior
        timeout-minutes: 15
        run: python3 scripts/run_check.py documentation
        working-directory: tested
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure() && hashFiles('tested/playwright-report/docs/**', 'tested/test-results/docs/**') != ''
        with:
          name: documentation-evidence
          path: |
            tested/playwright-report/docs
            tested/test-results/docs
          retention-days: 7
