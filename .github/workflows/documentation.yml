name: Documentation
on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: tested
          persist-credentials: false
          ref: ${{ github.event.inputs.pull_request && format('refs/pull/{0}/merge', github.event.inputs.pull_request) || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tested/package-lock.json
      - name: Use the project npm version
        run: npm install --global npm@10.9.8 --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
        working-directory: tested
      - run: npx playwright install --with-deps chromium
        working-directory: tested
      - run: npm run test:docs
        working-directory: tested
      - name: Check out stable documentation
        if: inputs.publish && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta') && github.event_name != 'pull_request'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          path: stable-docs
          persist-credentials: false
          ref: main
      - name: Check out beta documentation
        if: inputs.publish && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta') && github.event_name != 'pull_request'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          path: beta-docs
          persist-credentials: false
          ref: beta
      - name: Install stable documentation dependencies
        if: inputs.publish && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta') && github.event_name != 'pull_request'
        run: npm ci --no-audit --no-fund
        working-directory: stable-docs
      - name: Install beta documentation dependencies
        if: inputs.publish && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta') && github.event_name != 'pull_request'
        run: npm ci --no-audit --no-fund
        working-directory: beta-docs
      - name: Build stable documentation channel
        if: inputs.publish && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta') && github.event_name != 'pull_request'
        run: npm run build
        working-directory: stable-docs
        env:
          F1_DOCS_BASE_URL: /f1_sensor/
          F1_DOCS_CHANNEL: stable
      - name: Build beta documentation channel
        if: inputs.publish && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta') && github.event_name != 'pull_request'
        run: npm run build
        working-directory: beta-docs
        env:
          F1_DOCS_BASE_URL: /f1_sensor/beta/
          F1_DOCS_CHANNEL: beta
      - name: Assemble stable and beta documentation
        if: inputs.publish && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta') && github.event_name != 'pull_request'
        run: |
          mkdir pages-build
          cp -R stable-docs/build/. pages-build/
          mkdir pages-build/beta
          cp -R beta-docs/build/. pages-build/beta/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: inputs.publish && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta') && github.event_name != 'pull_request'
        with:
          path: pages-build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure() && hashFiles('tested/playwright-report/docs/**', 'tested/test-results/docs/**') != ''
        with:
          name: documentation-evidence
          path: |
            tested/playwright-report/docs
            tested/test-results/docs
          retention-days: 7
