name: Release
on:
  workflow_call:
permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: read
  id-token: write
  attestations: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Verify branch head still matches tested commit
        env:
          TESTED_SHA: ${{ github.sha }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          actual=$(git ls-remote origin "refs/heads/$RELEASE_BRANCH" | cut -f1)
          test "$actual" = "$TESTED_SHA" || { echo 'Branch advanced; release must use the new CI run.'; exit 1; }
      - name: Create or recover the release draft
        run: node .github/scripts/run-release.cjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify and reconcile the release tag
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const editorial = require('./.github/scripts/release-editorial.cjs');
            const tag = editorial.releaseTagAtHead({branch: context.ref.replace('refs/heads/', '')});
            if (!tag) {
              core.info('No release tag points at this commit; no release reconciliation is needed.');
              return;
            }
            await editorial.reconcileReleaseTag({
              github,
              context,
              core,
              tag,
              assetNames: ['f1_sensor.zip', 'f1_sensor.zip.sha256', 'f1_sensor.zip.spdx.json']
            });
      - name: Add promotion editorial to the release draft
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const editorial = require('./.github/scripts/release-editorial.cjs');
            await editorial.applyReleaseEditorial({github, context, core});
      - name: Attest release provenance
        if: hashFiles('f1_sensor.zip') != ''
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: f1_sensor.zip
