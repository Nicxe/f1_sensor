name: Release
on:
  workflow_call:
permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: read
  id-token: write
  attestations: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@nicxe'
      - run: npm ci --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Verify branch head still matches tested commit
        env:
          TESTED_SHA: ${{ github.sha }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          actual=$(git ls-remote origin "refs/heads/$RELEASE_BRANCH" | cut -f1)
          test "$actual" = "$TESTED_SHA" || { echo 'Branch advanced; release must use the new CI run.'; exit 1; }
      - name: Create or recover the release draft
        run: node .github/scripts/run-release.cjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Attest release provenance
        if: hashFiles('f1_sensor.zip') != ''
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: f1_sensor.zip
