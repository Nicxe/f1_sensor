name: Refresh Context7 docs

on:
  workflow_run:
    workflows: ["Release verification"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  refresh:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: deployment
        name: Confirm the tested site was deployed
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {...context.repo, run_id:context.payload.workflow_run.id, per_page:100});
            core.setOutput('deployed', jobs.some(job => job.name === 'deploy / deploy' && job.conclusion === 'success'));
      - name: Trigger Context7 re-index
        if: steps.deployment.outputs.deployed == 'true'
        run: |
          for i in 1 2 3; do
            response=$(curl --connect-timeout 10 --max-time 30 -s -w "\n%{http_code}" -X POST https://context7.com/api/v1/refresh \
              -H "Authorization: Bearer ${{ secrets.CONTEXT7_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d '{"libraryName": "/websites/nicxe_github_io_f1_sensor"}')
            http_code=$(echo "$response" | tail -1)
            body=$(echo "$response" | sed '$d')
            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              echo "Success: $body"
              exit 0
            fi
            if echo "$body" | grep -q "user-has-active-task"; then
              echo "Another indexing job is running, retrying in 30s... (attempt $i/3)"
              sleep 30
              continue
            fi
            echo "Request failed ($http_code): $body"
            exit 1
          done
          echo "Context7 is already processing an indexing job; no new refresh is needed."
          exit 0
