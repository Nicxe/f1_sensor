name: Safe automation checks
on:
  push:
    branches: [main, content]
  pull_request:
    branches: [main, content]
permissions:
  contents: read
jobs:
  automation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s ci_tests -p test_ci_policy.py
      - run: node --test ci_tests/issues.test.cjs ci_tests/sync.test.cjs
