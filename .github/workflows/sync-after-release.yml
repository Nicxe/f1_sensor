name: Synchronize published history
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      source:
        description: 'Published branch to synchronize'
        required: true
        type: choice
        options: [main, beta]
        default: main
      target:
        description: 'Target branch to synchronize'
        required: true
        type: choice
        options: [content, dev]
        default: content
permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: write
concurrency:
  group: synchronize-published-history
  cancel-in-progress: false
jobs:
  sync:
    if: vars.CI_ROLLOUT != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            if (context.payload.release) {
              context.payload.release = await require('./.github/scripts/release-publication.cjs').verifyPublishedRelease({
                github, context, core, releaseId: context.payload.release.id
              });
            }
            await require('./.github/scripts/sync-branches.cjs').synchronize({github, context, core});
