name: Synchronize published history
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Replay an already published release; leave empty for branch synchronization'
        required: false
        type: string
      source:
        description: 'Published branch to synchronize'
        required: true
        type: choice
        options: [main, beta]
        default: main
      target:
        description: 'Target branch to synchronize'
        required: true
        type: choice
        options: [content, dev]
        default: content
permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: write
concurrency:
  group: synchronize-published-history
  cancel-in-progress: false
jobs:
  sync:
    if: vars.CI_ROLLOUT != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Helpers must match the running workflow, even before promotion to main.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        with:
          script: |
            const release = await require('./.github/scripts/release-publication.cjs').resolvePublishedRelease({
              github, context, core, releaseTag: process.env.RELEASE_TAG
            });
            if (release) context.payload.release = release;
            await require('./.github/scripts/sync-branches.cjs').synchronize({github, context, core});
