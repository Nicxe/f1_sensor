name: Sync main back to beta and content

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  sync-beta:
    if: ${{ github.event.release.prerelease == false && github.event.release.target_commitish == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize main to beta
        run: git push origin main:beta --force

  sync-content:
    if: ${{ github.event.release.prerelease == false && github.event.release.target_commitish == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Force push main to content
        run: git push origin main:content --force
