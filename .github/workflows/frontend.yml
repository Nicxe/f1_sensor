name: Frontend
on:
  workflow_call:
    inputs:
      checkout_ref:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    # Browser provisioning has its own budget, separate from the full suite.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout_ref || (github.event.inputs.pull_request && format('refs/pull/{0}/merge', github.event.inputs.pull_request)) || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use the project npm version
        run: node scripts/install_project_npm.cjs
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium and system dependencies
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium
      - name: Verify frontend behavior
        timeout-minutes: 12
        run: python3 scripts/run_check.py frontend
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure() && hashFiles('playwright-report/**', 'test-results/playwright/**') != ''
        with:
          name: frontend-evidence
          path: |
            playwright-report
            test-results/playwright
          retention-days: 7
