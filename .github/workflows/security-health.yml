name: Daily dependency security health
on:
  schedule:
    - cron: '11 5 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      tools_ref:
        description: Immutable reviewed evaluator commit for a default-branch launcher
        type: string
        default: ''
      target_ref:
        description: Optional immutable dependency snapshot instead of the daily branch matrix
        type: string
        default: ''
permissions:
  contents: read
jobs:
  audit:
    uses: ./.github/workflows/security-snapshot.yml
    with:
      tools_ref: ${{ inputs.tools_ref || github.workflow_sha }}
      target_ref: ${{ inputs.target_ref || '' }}
