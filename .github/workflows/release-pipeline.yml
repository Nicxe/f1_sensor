name: Release verification
run-name: ${{ github.ref_name == 'beta' && 'Beta' || 'Stable' }} verification & release · ${{ github.sha }}
on:
  push:
    branches: [beta, main]
  workflow_dispatch:
    inputs:
      release:
        description: Create or recover a draft after complete verification
        type: boolean
        default: true
      create_rc:
        description: Skapa RC (beta only; keep release draft creation enabled)
        type: boolean
        default: false
permissions:
  contents: read
  pull-requests: read
  actions: read
concurrency:
  group: release-pipeline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Restrict RC creation to manual beta releases
        env:
          CREATE_RC: ${{ inputs.create_rc || false }}
          CREATE_RELEASE: ${{ inputs.release || false }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$CREATE_RC" = true ]; then
            if [ "$EVENT_NAME" != workflow_dispatch ] || [ "$RELEASE_BRANCH" != beta ] || [ "$CREATE_RELEASE" != true ]; then
              echo '::error::Skapa RC requires a manual beta run with release draft creation enabled.'
              exit 1
            fi
          fi
  checks:
    needs: validate
    uses: ./.github/workflows/ci-checks.yml
    with:
      allow_reuse: false
      separate_delivery: true
  documentation:
    needs: checks
    if: ${{ !cancelled() && needs.checks.outputs.tested_sha }}
    uses: ./.github/workflows/documentation.yml
    with:
      checkout_ref: ${{ needs.checks.outputs.tested_sha }}
  security:
    name: Release security readiness
    needs: checks
    if: ${{ !cancelled() && needs.checks.outputs.tested_sha }}
    uses: ./.github/workflows/audit.yml
    with:
      checkout_ref: ${{ needs.checks.outputs.tested_sha }}
      mode: gate
  release:
    needs: [checks, security]
    # Documentation delivery is independent; serious dependency risk is not.
    if: >-
      !cancelled() && needs.checks.result == 'success' && needs.checks.outputs.product_result == 'success' &&
      needs.security.result == 'success' && vars.CI_ROLLOUT != 'true' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release)) &&
      (github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/main')
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      create_rc: ${{ github.event_name == 'workflow_dispatch' && inputs.create_rc }}
