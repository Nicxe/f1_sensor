name: Notify issues after publication
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag to backfill
        required: true
        type: string
      issue_numbers:
        description: 'Optional issue numbers to backfill; leave empty to use the release notes'
        required: false
        type: string
permissions:
  contents: write
  issues: write
concurrency:
  group: release-issues-${{ github.event.release.id || inputs.release_tag }}
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Helpers must match the running workflow, even before promotion to main.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          ISSUE_NUMBERS: ${{ inputs.issue_numbers }}
        with:
          script: |
            const release = await require('./.github/scripts/release-publication.cjs').resolvePublishedRelease({
              github, context, core, releaseTag: process.env.RELEASE_TAG
            });
            if (!release) throw new Error('release_tag is required for a manual backfill.');
            let issueNumbers;
            const suppliedIssues = (process.env.ISSUE_NUMBERS || '').trim();
            if (!context.payload.release && suppliedIssues) {
              issueNumbers = suppliedIssues
                .split(/[\s,]+/)
                .map((value) => value.replace(/^#/, ''))
                .filter((value) => /^\d+$/.test(value))
                .map(Number);
              if (!issueNumbers.length) throw new Error('Provide at least one valid issue number.');
            }
            await require('./.github/scripts/issue-automation.cjs').releasedIssues(
              {github, context},
              {release, issueNumbers}
            );
            core.info('Issue notification processing for the verified publication completed.');
