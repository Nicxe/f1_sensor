name: Notify issues after publication
on:
  release:
    types: [published]
permissions:
  contents: read
  issues: write
concurrency:
  group: release-issues-${{ github.event.release.id }}
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            await require('./.github/scripts/issue-automation.cjs').releasedIssues({github, context});
