# Temporary verifier for content synchronization before normal code promotion.
name: Legacy content synchronization verification
on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Repository-owned synchronization PR targeting content
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: legacy-sync-${{ inputs.pull_request }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      head: ${{ steps.pr.outputs.head }}
    steps:
      - id: pr
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PR_NUMBER: ${{ inputs.pull_request }}
        with:
          script: |
            const pr=(await github.rest.pulls.get({...context.repo,pull_number:Number(process.env.PR_NUMBER)})).data;
            if(pr.base.ref!=='content' || pr.head.repo.full_name!==`${context.repo.owner}/${context.repo.repo}` || pr.user.login!=='github-actions[bot]' || !pr.head.ref.startsWith('sync/')) throw new Error('Only trusted content synchronization is supported.');
            if(!pr.mergeable || !pr.merge_commit_sha) throw new Error('Resolve conflicts before verification.');
            core.setOutput('head',pr.head.sha);core.setOutput('merge',pr.merge_commit_sha);
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.pr.outputs.merge }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: pip install pytest-homeassistant-custom-component==0.13.307 pytest-cov
      - run: python -m pytest -q custom_components/f1_sensor/tests --cov=custom_components.f1_sensor --cov-report=term
      - run: python -m unittest discover -s ci_tests -p test_ci_policy.py
      - run: node --test ci_tests/issues.test.cjs ci_tests/sync.test.cjs
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:docs
  report:
    needs: verify
    if: always() && needs.verify.outputs.head
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: read
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PR_NUMBER: ${{ inputs.pull_request }}
          TESTED_HEAD: ${{ needs.verify.outputs.head }}
          RESULT: ${{ needs.verify.result }}
        with:
          script: |
            const pr=(await github.rest.pulls.get({...context.repo,pull_number:Number(process.env.PR_NUMBER)})).data;
            if(pr.head.sha!==process.env.TESTED_HEAD) throw new Error('PR changed; verify again.');
            await github.rest.checks.create({...context.repo,name:'Legacy content verification',head_sha:process.env.TESTED_HEAD,status:'completed',conclusion:process.env.RESULT==='success'?'success':'failure',details_url:`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,output:{title:'Existing stable test baseline',summary:'HA 2026.1.2, existing Python tests, documentation and safe automation tests. Full current HA and 95% runtime coverage activate with normal code promotion.'}});
