name: Workflow and automation tests
on:
  workflow_call:
    inputs:
      checkout_ref:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  automation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout_ref || (github.event.inputs.pull_request && format('refs/pull/{0}/merge', github.event.inputs.pull_request)) || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Use the project npm version
        run: node scripts/install_project_npm.cjs
      - name: Install Node dependencies
        run: npm ci --ignore-scripts
      - run: python3 scripts/run_check.py automation
