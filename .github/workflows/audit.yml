name: Dependency audit
on:
  workflow_call:
    inputs:
      checkout_ref:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  audit:
    # Use the reviewed immutable CI evaluator and its matching trusted tools.
    # Evaluate this exact snapshot with trusted tools, not its executable code.
    uses: Nicxe/f1_sensor/.github/workflows/security-health.yml@f3072bee79763b4cc42a6c58af0de58b000b0c57
    with:
      tools_ref: 'f3072bee79763b4cc42a6c58af0de58b000b0c57'
      target_ref: ${{ inputs.checkout_ref || (github.event.inputs.pull_request && format('refs/pull/{0}/merge', github.event.inputs.pull_request)) || github.sha }}
