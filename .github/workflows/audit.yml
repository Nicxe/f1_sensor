name: Dependency audit
on:
  workflow_call:
    inputs:
      checkout_ref:
        type: string
        default: ''
      mode:
        type: string
        default: gate
      base:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  audit:
    # Use the reviewed immutable CI evaluator and its matching trusted tools.
    # Evaluate this exact snapshot with trusted tools, not its executable code.
    uses: Nicxe/f1_sensor/.github/workflows/security-snapshot.yml@5184cedf1ca388135df0597a631d92478f212074
    with:
      tools_ref: '5184cedf1ca388135df0597a631d92478f212074'
      target_ref: ${{ inputs.checkout_ref || (github.event.inputs.pull_request && format('refs/pull/{0}/merge', github.event.inputs.pull_request)) || github.sha }}
