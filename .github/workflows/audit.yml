name: Dependency audit
on:
  workflow_call:
    inputs:
      checkout_ref:
        type: string
        default: ''
      mode:
        type: string
        default: gate
      base:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  audit:
    # Use the reviewed immutable CI evaluator and its matching trusted tools.
    # Evaluate this exact snapshot with trusted tools, not its executable code.
    uses: Nicxe/f1_sensor/.github/workflows/security-snapshot.yml@bae4992f0aeddeb88f5afd8422dc0ad3843baae7
    with:
      tools_ref: 'bae4992f0aeddeb88f5afd8422dc0ad3843baae7'
      target_ref: ${{ inputs.checkout_ref || (github.event.inputs.pull_request && format('refs/pull/{0}/merge', github.event.inputs.pull_request)) || github.sha }}
