name: Shared checks
on:
  workflow_call:
    inputs:
      allow_reuse:
        type: boolean
        default: false
      separate_delivery:
        description: Release pipeline owns documentation delivery and full security readiness
        type: boolean
        default: false
    outputs:
      deploy:
        value: ${{ jobs.plan.outputs.deploy }}
      tested_base:
        value: ${{ jobs.plan.outputs.tested_base }}
      tested_head:
        value: ${{ jobs.plan.outputs.tested_head }}
      tested_sha:
        value: ${{ jobs.plan.outputs.tested_sha }}
      tested_tree:
        value: ${{ jobs.plan.outputs.tested_tree }}
      product_result:
        value: ${{ jobs.required.outputs.result }}
permissions:
  contents: read
  pull-requests: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tested_base: ${{ steps.plan.outputs.tested_base }}
      tested_head: ${{ steps.plan.outputs.tested_head }}
      tested_sha: ${{ steps.plan.outputs.tested_sha }}
      tested_tree: ${{ steps.plan.outputs.tested_tree }}
      reused: ${{ steps.reuse.outputs.reused }}
      deploy: ${{ steps.plan.outputs.deploy }}
      selected: ${{ steps.plan.outputs.selected }}
      lint: ${{ steps.reuse.outputs.lint }}
      backend: ${{ steps.reuse.outputs.backend }}
      frontend: ${{ steps.reuse.outputs.frontend }}
      documentation: ${{ steps.reuse.outputs.documentation }}
      translations: ${{ steps.reuse.outputs.translations }}
      validation: ${{ steps.reuse.outputs.validation }}
      package: ${{ steps.reuse.outputs.package }}
      audit: ${{ steps.reuse.outputs.audit }}
      blueprints: ${{ steps.reuse.outputs.blueprints }}
      automation: ${{ steps.reuse.outputs.automation }}
      audit_mode: ${{ steps.plan.outputs.audit_mode }}
      audit_base: ${{ steps.plan.outputs.audit_base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.inputs.pull_request && format('refs/pull/{0}/merge', github.event.inputs.pull_request) || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SEPARATE_DELIVERY: ${{ inputs.separate_delivery }}
        run: python3 scripts/ci_policy.py plan
      - id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SELECTED: ${{ steps.plan.outputs.selected }}
          CI_ALLOW_REUSE: ${{ inputs.allow_reuse }}
        run: python3 scripts/ci_reuse.py plan
  lint:
    needs: plan
    if: needs.plan.outputs.lint == 'true'
    uses: ./.github/workflows/ruff.yml
    with:
      checkout_ref: ${{ needs.plan.outputs.tested_sha }}
  backend:
    needs: plan
    if: needs.plan.outputs.backend == 'true'
    uses: ./.github/workflows/tests.yml
    with:
      checkout_ref: ${{ needs.plan.outputs.tested_sha }}
  frontend:
    needs: plan
    if: needs.plan.outputs.frontend == 'true'
    uses: ./.github/workflows/frontend.yml
    with:
      checkout_ref: ${{ needs.plan.outputs.tested_sha }}
  documentation:
    needs: plan
    if: needs.plan.outputs.documentation == 'true'
    uses: ./.github/workflows/documentation.yml
    with:
      checkout_ref: ${{ needs.plan.outputs.tested_sha }}
  translations:
    needs: plan
    if: needs.plan.outputs.translations == 'true'
    uses: ./.github/workflows/translations.yml
    with:
      checkout_ref: ${{ needs.plan.outputs.tested_sha }}
  validation:
    needs: plan
    if: needs.plan.outputs.validation == 'true'
    uses: ./.github/workflows/validate.yml
    with:
      checkout_ref: ${{ needs.plan.outputs.tested_sha }}
  package:
    needs: plan
    if: needs.plan.outputs.package == 'true'
    uses: ./.github/workflows/package.yml
    with:
      checkout_ref: ${{ needs.plan.outputs.tested_sha }}
  audit:
    needs: plan
    if: needs.plan.outputs.audit == 'true'
    uses: ./.github/workflows/audit.yml
    with:
      checkout_ref: ${{ needs.plan.outputs.tested_sha }}
      mode: ${{ needs.plan.outputs.audit_mode }}
      base: ${{ needs.plan.outputs.audit_base }}
  blueprints:
    needs: plan
    if: needs.plan.outputs.blueprints == 'true'
    uses: ./.github/workflows/tests.yml
    with:
      blueprints_only: true
      checkout_ref: ${{ needs.plan.outputs.tested_sha }}
  automation:
    needs: plan
    if: needs.plan.outputs.automation == 'true'
    uses: ./.github/workflows/automation-tests.yml
    with:
      checkout_ref: ${{ needs.plan.outputs.tested_sha }}
  required:
    name: Verify selected checks
    needs: [plan, lint, backend, frontend, documentation, translations, validation, package, audit, blueprints, automation]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      result: ${{ steps.verdict.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.tested_sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Verify every applicable result
        id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_policy.py gate
