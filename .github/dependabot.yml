version: 2

registries:
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    scope: "@nicxe"
    token: ${{ secrets.DEPENDABOT_GH_PACKAGES_TOKEN }}

updates:
  # Security updates use the default branch. Group them so independent fixes
  # do not block one another behind the repository-wide dependency audit.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    registries:
      - github-packages
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    registries:
      - github-packages
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "conventional-changelog-conventionalcommits"
        update-types:
          - "version-update:semver-major"
    groups:
      docs-site:
        patterns:
          - "@docusaurus/*"
          - "@easyops-cn/docusaurus-search-local"
          - "@mdx-js/*"
          - "clsx"
          - "prism-react-renderer"
          - "react"
          - "react-dom"
      release-tooling:
        dependency-type: "development"
        patterns:
          - "@nicxe/semantic-release-config"
          - "@semantic-release/*"
          - "conventional-changelog-conventionalcommits"
          - "semantic-release"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      github-actions:
        patterns:
          - "*"
