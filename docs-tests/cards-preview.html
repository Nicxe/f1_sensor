<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>F1 Sensor documentation previews — illustrative data</title>
  <style>
    :root { color-scheme: dark; --primary-color: #e10600; --primary-text-color: #f7f7f7; --secondary-text-color: #b8bcc4; --card-background-color: #16181d; --ha-card-background: #16181d; --divider-color: #343740; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; background: #0d0f13; color: #f7f7f7; font-family: Arial,sans-serif; }
    #mount { display: block; width: 100%; }
    #mount > * { display: block; }
    ha-card { display: block; border-radius: 12px; background: var(--ha-card-background); }
    ha-icon { display: inline-block; width: 24px; height: 24px; }
    .provenance { color: #b8bcc4; margin: 16px 0 0; font-size: 12px; }
  </style>
</head>
<body>
  <main id="mount" aria-label="Bundled card rendered with illustrative data"></main>
  <p class="provenance">Documentation preview · illustrative session data</p>
  <script type="module" src="./cards-preview.js"></script>
</body>
</html>
